[package]
name = "chromatika_policy"
edition = "2024"

[dependencies]
# `override = true` on the direct Sui + MoveStdlib deps resolves the multi-version
# conflict ika's transitive Sui dep (at a different rev) triggers. Without this,
# `sui move build` fails with "Package depends on multiple versions of 0x2".
#
# Deps point at MAINNET subdir (`deployed_contracts/mainnet/...`) because sui's
# publish check compares source bytecode against the on-chain package - testnet
# sources don't match mainnet bytecode, even though the Move.toml content is
# identical. For testnet deploys, swap subdir + addresses to testnet (see
# ika.git:deployed_contracts/testnet/).
Sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "framework/mainnet", override = true }
MoveStdlib = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/move-stdlib", rev = "framework/mainnet", override = true }
ika = { git = "https://github.com/dwallet-labs/ika.git", subdir = "deployed_contracts/mainnet/ika", rev = "main" }
ika_common = { git = "https://github.com/dwallet-labs/ika.git", subdir = "deployed_contracts/mainnet/ika_common", rev = "main" }
ika_dwallet_2pc_mpc = { git = "https://github.com/dwallet-labs/ika.git", subdir = "deployed_contracts/mainnet/ika_dwallet_2pc_mpc", rev = "main" }

[addresses]
chromatika_policy = "0x0"
# ika published-at packageIds for MAINNET. See ika.git:deployed_contracts/mainnet/address.yaml.
ika = "0x7262fb2f7a3a14c888c438a3cd9b912469a58cf60f367352c46584262e8299aa"
ika_common = "0x9e1e9f8e4e51ee2421a8e7c0c6ab3ef27c337025d15333461b72b1b813c44175"
ika_dwallet_2pc_mpc = "0xdd24c62739923fbf582f49ef190b4a007f981ca6eb209ca94f3a8eaf7c611317"
