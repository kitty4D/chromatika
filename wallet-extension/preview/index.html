<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chromatika UI preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body {
        background: #0b0b0f;
        font-family: Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      /* form controls don't inherit body font in some browsers — match wallet runtime */
      button, input, select, textarea {
        font: inherit;
      }
      .preview-frame {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 24px;
        padding: 32px;
        flex-wrap: wrap;
      }
      .preview-surface {
        border: 1px solid #2a2a33;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
        background: var(--theme-chrome-popup-bg, #121218);
      }
      .preview-surface--popup { width: 360px; height: 600px; }
      .preview-surface--sidepanel { width: 400px; height: 720px; }
      .preview-label { font-size: 12px; opacity: 0.6; margin: 0 0 6px 4px; letter-spacing: 0.04em; text-transform: uppercase; }
      .preview-nav { display: flex; gap: 8px; padding: 16px 32px 0; flex-wrap: wrap; }
      .preview-nav a {
        color: #9ea0a8; text-decoration: none; font-size: 13px;
        padding: 6px 10px; border: 1px solid #2a2a33; border-radius: 8px;
      }
      .preview-nav a.active { color: #fff; border-color: #5f6; }
      /* .fx-* rules live in src/ui/wallet.css alongside the component */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
