[package]
name = "chromatika-policy"
version = "0.1.0"
description = "chromatika on-chain spend caps + panic for Solana ika base. Pre-alpha; awaits ika Solana Alpha-1."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chromatika_policy"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Required by Anchor 0.30+ for IDL generation. `anchor build` runs the program crate
# twice: once with `idl-build` enabled (to emit `target/idl/chromatika_policy.json` +
# `target/types/chromatika_policy.ts`) and once without (for the actual program binary).
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Anchor 0.31+ is required: 0.30.1's IDL builder calls
# `proc_macro2::Span::source_file()` which depends on a nightly rustc API that was renamed
# in newer rustc versions, making Anchor 0.30.1 + stable rustc 1.89 effectively
# uncompilable. 0.31.1 rewrote the IDL emitter to not need that API.
anchor-lang = "0.31.1"
