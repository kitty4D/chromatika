# Policy Vault is Sui-only today. The Solana Anchor program is pre-alpha
# scaffolding pending ika Solana Alpha-1 (CPI bodies stub to no-ops). The
# chromatika UI hides the opt-in for Solana-base vaults and the background
# action layer refuses to wrap. `anchor build` still works for verifying the
# Rust program compiles; there is no TS test script wired today (the bankrun
# harness was removed because solana-bankrun ships no Windows binary, and the
# program does nothing testable until Alpha-1 lands a real CPI surface).
#
# program id above is a placeholder. When the program ships, copy the actual
# program id from `target/deploy/chromatika_policy-keypair.json` into:
#   1. this file (programs.localnet + programs.devnet entries)
#   2. lib.rs declare_id!(...)
#   3. wallet-extension chrome extension Settings -> Security -> "On-chain spend caps + panic"
#      (parallel slot for Solana base, separate from the Sui package id)
