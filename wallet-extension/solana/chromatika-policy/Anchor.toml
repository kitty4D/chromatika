[programs.localnet]
chromatika_policy = "F6fnHYySvjJjvFGzqLb8h2L9qZrq2M8krNviXdNJaPsP"

[programs.devnet]
chromatika_policy = "F6fnHYySvjJjvFGzqLb8h2L9qZrq2M8krNviXdNJaPsP"

[registry]
