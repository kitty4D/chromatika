name = "chromatika-team-funder"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# nodejs_compat is required by `@mysten/sui` (it imports a few small node-style helpers
# - `Buffer`, etc. - that the Workers runtime polyfills under this flag).
compatibility_flags = ["nodejs_compat"]

# Durable Object: one global instance keyed by a fixed name, holds:
#   - per-address fundedAt timestamps (lifetime one-shot dedupe)
#   - rolling per-day funding count (DAILY_CAP enforcement)
#   - cumulative lifetime funding count (optional LIFETIME_CAP)
[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDurableObject"]

# ---- env vars (non-secret; secrets live in `wrangler secret put`) ----
# defaults are mainnet because chromatika has only ever tested Sui on mainnet. override per-env if needed.
[vars]
SUI_GRAPHQL_URL = "https://graphql.mainnet.sui.io/graphql"
IKA_COIN_TYPE = "0x7262fb2f7a3a14c888c438a3cd9b912469a58cf60f367352c46584262e8299aa::ika::IKA"
DAILY_CAP = "25"
# LIFETIME_CAP is optional; unset = unlimited.

# Required secrets (set via `wrangler secret put`):
#   - FUNDER_SUI_PRIVKEY        (suiprivkey1... bech32, the team funder's Ed25519 private key)
#   - FUNDER_BEARER_TOKEN       (random hex, must match VITE_FUNDER_TOKEN bundled in chromatika)
#
# Optional secrets:
#   - LIFETIME_CAP              (string number; absent = unlimited)
#   - ADMIN_BEARER_TOKEN        (separate token for `DELETE /address/<addr>` admin endpoint)

[observability]
enabled = true

# ---- staging env (separate funder wallet, lower caps) ----
[env.staging]
name = "chromatika-team-funder-staging"

[env.staging.vars]
SUI_GRAPHQL_URL = "https://graphql.mainnet.sui.io/graphql"
IKA_COIN_TYPE = "0x7262fb2f7a3a14c888c438a3cd9b912469a58cf60f367352c46584262e8299aa::ika::IKA"
DAILY_CAP = "10"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDurableObject"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDurableObject"]

# Stable hostname so chromatika builds can point VITE_FUNDER_URL at one origin across
# every wrangler deploy. requires the chromatika.xyz zone to live in this cloudflare account;
# wrangler attaches the custom domain automatically when custom_domain = true.
[[routes]]
pattern = "fund.chromatika.xyz"
custom_domain = true
